name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'auth-service/**'
      - 'feedback-microservice/**'
      - 'gateway/**'
      - 'deploy-aws.sh'
      - '.github/workflows/deploy-aws.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Connecting to EC2 and pulling latest changes from GitHub..."
            cd ~/campus-feedback-system || cd campus-feedback-system || cd /home/ubuntu/campus-feedback-system
            
            # Stash any local untracked changes and reset to origin/main
            git fetch origin main
            git reset --hard origin/main
            
            # Ensure Gemini API key is configured on the instance
            if [ ! -z "${{ secrets.GEMINI_API_KEY }}" ]; then
              grep -q "GEMINI_API_KEY" feedback-microservice/.env 2>/dev/null || echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> feedback-microservice/.env
            fi
            
            # Execute automated deployment script
            chmod +x deploy-aws.sh
            bash deploy-aws.sh
            
            echo "✅ AWS Backend Deployment Complete!"
