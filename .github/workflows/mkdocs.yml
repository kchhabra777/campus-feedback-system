name: mkdocs 
on:
  push:
    branches:
      - master 
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install \
          mkdocs \
          mkdocs-material \
          mkdocs-material-extensions \
          mkdocstrings \
          mkdocstrings-python \
          mkdocs-literate-nav \
          mkdocs-section-index \
          mkdocs-git-revision-date-localized-plugin \
          mkdocs-git-authors-plugin \
          pymdown-extensions
      - run: |
          cp -r assets docs/assets
          mkdir -p docs/javascript
          echo 'document.addEventListener("DOMContentLoaded", function() { renderMathInElement(document.body, { delimiters: [ {left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false} ] }); });' > docs/javascript/arithmatex.js
      - run: mkdocs gh-deploy --force
